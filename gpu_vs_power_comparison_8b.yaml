# ============================================================================
# Analysis Guidelines
# ============================================================================
# After running these experiments, compare:
#
# 1. Similar Power Budget Comparisons:
#    - 4 GPUs @ 600W (2,400W) vs 6 GPUs @ 400W (2,400W) - need to add 400W
#    - 4 GPUs @ 700W (2,800W) vs 8 GPUs @ 350W (2,800W) - need to add 350W
#    - 6 GPUs @ 500W (3,000W) vs 8 GPUs @ 375W (3,000W) - need to add 375W
#
# 2. Metrics to Compare:
#    - tokens/s/gpu: Per-GPU throughput
#    - tokens/s/watt: Energy efficiency
#    - Total cluster throughput
#    - TPOT and TTFT: Latency metrics
#
# 3. Expected Findings:
#    - More GPUs at lower power: Better parallelism, potentially better latency
#    - Fewer GPUs at higher power: Better per-GPU efficiency, less overhead
#    - Communication overhead increases with more GPUs (especially for TP)
#
# Run with:
#   uv run aic patch gpu_vs_power_comparison.yaml --dump-all-configs
# ============================================================================
