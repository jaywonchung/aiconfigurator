# ============================================================================
# GPU Count vs. Power Limit Comparison
# ============================================================================
# This configuration compares two strategies for power optimization:
# 1. Using fewer GPUs at full power
# 2. Using more GPUs at reduced power
#
# Analysis questions:
# - For similar total power budgets, which is better?
# - How does throughput scale with GPU count vs. power limit?
# - What's the energy efficiency (tokens/s/watt) trade-off?
# ============================================================================

# Define experiments to run
exps:
  # 4 GPUs at different power limits (2,000W - 2,800W total)
  # - exp_4gpu_500w
  # - exp_4gpu_600w
  # - exp_4gpu_700w

  # 6 GPUs at different power limits (3,000W - 4,200W total)
  # - exp_6gpu_500w
  # - exp_6gpu_600w
  # - exp_6gpu_700w

  # 8 GPUs at different power limits (4,000W - 5,600W total)
  - exp_8gpu_500w
  - exp_8gpu_600w
  - exp_8gpu_700w

# ============================================================================
# 4 GPUs Experiments
# ============================================================================

exp_4gpu_500w:
  mode: "patch"
  serving_mode: "agg"
  model_name: "LLAMA3.1_8B"
  total_gpus: 4
  system_name: "h100_sxm"
  backend_name: "trtllm"
  backend_version: "1.2.0rc0.post1"

  isl: 4000
  osl: 1000
  ttft: 1000.0
  tpot: 100.0

  power_limits: [500]
  cluster_power_budget: 2000.0  # 4 × 500W

  config:
    worker_config:
      gemm_quant_mode: "fp8_block"
      moe_quant_mode: "fp8_block"
      kvcache_quant_mode: "float16"
      fmha_quant_mode: "float16"
      comm_quant_mode: "half"
      num_gpu_per_worker: [1, 2, 4]
      tp_list: [1, 2, 4]
      pp_list: [1]
      dp_list: [1, 2, 4]

