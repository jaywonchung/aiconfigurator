# ============================================================================
# Analysis Guidelines
# ============================================================================
# After running these experiments, compare:
#
# 1. Similar Power Budget Comparisons:
#    - 16 GPUs @ 500W (8,000W)  vs 32 GPUs @ 250W (8,000W)  - need to add 250W
#    - 16 GPUs @ 700W (11,200W) vs 32 GPUs @ 350W (11,200W) - need to add 350W
#    - 24 GPUs @ 500W (12,000W) vs 32 GPUs @ 375W (12,000W) - need to add 375W
#
# 2. Expected Trade-offs for 70B Model:
#    - Communication overhead more significant than 8B (larger model, more data transfer)
#    - Minimum TP size needed (70B requires at least TP=4 for memory)
#    - More replicas = better throughput but diminishing returns
#    - Power limit impact may differ from 8B due to compute intensity
#
# 3. Metrics to Compare:
#    - tokens/s/gpu: Per-GPU throughput
#    - tokens/s/watt: Energy efficiency
#    - Total cluster throughput
#    - TPOT and TTFT: Latency metrics
#
# 4. 70B-Specific Considerations:
#    - Model requires more memory, limiting configurations
#    - TP=4 and TP=8 are primary parallelism strategies (from baseline)
#    - Higher compute intensity may make power limits more impactful
#    - Communication overhead more pronounced with TP
#
# Run with:
#   uv run aic patch gpu_vs_power_comparison_70b.yaml --dump-all-configs
#
# Analyze with:
#   python analyze_gpu_vs_power.py test_output/LLAMA3.1_70B_isl4000_osl1000_ttft1000_tpot100_*/
# ============================================================================
