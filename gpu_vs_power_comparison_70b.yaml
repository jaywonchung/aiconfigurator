# ============================================================================
# GPU Count vs. Power Limit Comparison - LLAMA 3.1 70B
# ============================================================================
# This configuration compares two strategies for power optimization:
# 1. Using fewer GPUs at full power
# 2. Using more GPUs at reduced power
#
# Analysis questions:
# - For similar total power budgets, which is better?
# - How does throughput scale with GPU count vs. power limit?
# - What's the energy efficiency (tokens/s/watt) trade-off?
#
# Based on power_aware_baseline.yaml parameters
# ============================================================================

# Define experiments to run
exps:
  # 16 GPUs at different power limits (8,000W - 11,200W total)
  # - exp_16gpu_500w
  # - exp_16gpu_600w
  # - exp_16gpu_700w

  # 24 GPUs at different power limits (12,000W - 16,800W total)
  # - exp_24gpu_500w
  # - exp_24gpu_600w
  # - exp_24gpu_700w

  # 32 GPUs at different power limits (16,000W - 22,400W total)
  - exp_32gpu_500w
  - exp_32gpu_600w
  - exp_32gpu_700w

# ============================================================================
# 16 GPUs Experiments
# ============================================================================

exp_16gpu_500w:
  mode: "patch"
  serving_mode: "agg"
  model_name: "LLAMA3.1_70B"
  total_gpus: 16
  system_name: "h100_sxm"
  backend_name: "trtllm"
  backend_version: "1.2.0rc0.post1"

  isl: 4000
  osl: 1000
  ttft: 1000.0
  tpot: 100.0

  power_limits: [500]
  cluster_power_budget: 8000.0  # 16 × 500W

  config:
    worker_config:
      gemm_quant_mode: "fp8_block"
      moe_quant_mode: "fp8_block"
      kvcache_quant_mode: "float16"
      fmha_quant_mode: "float16"
      comm_quant_mode: "half"
      num_gpu_per_worker: [4, 8]
      tp_list: [1, 2, 4, 8]
      pp_list: [1]
      dp_list: [1, 2, 4, 8]

